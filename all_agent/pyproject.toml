authors = [
    { name = "Felix", email = "17223001+felix-03@user.noreply.gitee.com" }
]
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.7",
    "dotenv>=0.9.9",
    "langchain>=1.3.15",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.0",
